name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: bun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check for vulnerabilities
        working-directory: frontend
        run: bun audit --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build
        working-directory: frontend
        run: bun run vite build

  backend:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download -x

      - name: govulncheck
        run: |
          $(go env GOPATH)/bin/govulncheck -show verbose ./...
      - name: gosec
        run: |
          $(go env GOPATH)/bin/gosec -exclude=G104 --exclude-dir frontend --exclude-dir internal/db/store ./...
      - name: go vet
        run: |
          go vet ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -v -o app .
