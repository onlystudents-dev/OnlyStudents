name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: bun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: bun run vite build

  backend:
    runs-on: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dependencies
        run: go mod download -x

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -v -o app .