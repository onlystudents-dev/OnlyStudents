<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Hi {{.Name}},</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#374151;">
                We received a request to reset your OnlyStudents password. Click the button below to choose a new one.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:6px;background-color:#111827;">
                    <a href="{{.ResetURL}}" style="display:inline-block;padding:12px 24px;font-size:14px;color:#ffffff;text-decoration:none;">
                      Reset password
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#6b7280;">
                If the button doesn't work, copy and paste this link into your browser:<br>
                {{.ResetURL}}
              </p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#6b7280;">
                If you didn't request a password reset, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
