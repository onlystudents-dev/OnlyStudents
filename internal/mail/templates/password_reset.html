<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="500" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Hi {{.Name}},</h1>
              <p style="margin:0 0 0;font-size:14px;line-height:1.6;color:#374151;">
                We received a request to reset your OnlyStudents password.
              </p>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#374151;">
                Your code which you can reset your password with is <strong>{{.ResetCode}}</strong>
              </p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#6b7280;">
                If you didn't request a password reset, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
