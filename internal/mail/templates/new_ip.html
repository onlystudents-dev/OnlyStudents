<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New login detected</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Hi {{.Name}},</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#374151;">
                We noticed a login to your OnlyStudents account from a new IP address.
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;border-radius:6px;margin:0 0 24px;">
                <tr>
                  <td style="padding:16px;font-size:13px;line-height:1.8;color:#374151;">
                    <strong>IP address:</strong> {{.IPAddress}}<br>
                    <strong>Time:</strong> {{.Time}}
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:12px;line-height:1.6;color:#6b7280;">
                If this was you, no action is needed. If you don't recognize this activity, we recommend changing your password immediately.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
